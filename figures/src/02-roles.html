<html><head><meta charset=utf-8><style>body{margin:0;font-family:'Noto Sans CJK SC',sans-serif;background:#fff;color:#1f2937}

.row{display:flex;gap:14px;align-items:stretch}.box{border-radius:12px;padding:14px 16px;flex:1;font-size:15px;line-height:1.55}

.opt{background:#9ca3af}</style></head><body><div class=w><h1>AI 当教练，人当运动员</h1><div class=row><div class='box c2'><b>AI 负责：不必要的难</b>找资料、整理材料<br>起草大纲<br>讲解卡住的地方，一次一个提示<br>出题、判分、指出缺口<br>起草卡片、排复习日程</div>
<div class='box c4'><b>人负责：必要的难</b>拍板目标和取舍<br>选定权威材料<br>先自己读、先自己试<br>闭卷回忆、第二天讲回<br>删改卡片，每天清掉到期复习</div></div>
<div class=row style='margin-top:14px'><div class='box g'><b>四条硬规则</b>① 先自己想，再问 AI　② AI 不先给完整答案　③ 用自己选的材料　④ 对话里重问一遍不算复习</div></div></div></body></html>
